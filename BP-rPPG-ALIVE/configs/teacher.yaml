data:
  root: processed/teacher_ppg/4_sec
  train_ratio: 0.8
  val_ratio: 0.1

model:
  # 4 seconds x 30 Hz = 120 samples.
  clip_samples: 120
  internal_filters: 5
  kernel_size: 3
  dropout: 0.01
  # null generates dilation powers 0...floor(log2(clip_samples)),
  # corresponding to dilations 1,2,4,...,64 for L=120.
  dilation_powers: null
  mlp_hidden: [64]

training:
  epochs: 20
  batch_size: 4
  learning_rate: 0.0001
  seed: 42
  num_workers: 0

output:
  dir: runs/teacher
