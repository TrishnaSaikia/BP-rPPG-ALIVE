data:
  root: processed/student
  quality: HQ
  clip_seconds: 4
  fps: 30
  k_signals: 15
  train_ratio: 0.8
  val_ratio: 0.1

model:
  clip_samples: 120
  internal_filters: 5
  kernel_size: 3
  dropout: 0.01
  dilation_powers: null
  mlp_hidden: [64]

training:
  epochs: 20
  batch_size: 4
  learning_rate: 0.0001
  seed: 42
  num_workers: 0

loss:
  lambda_f: 1.0
  lambda_df: 1.0

testing:
  batch_size: 4
  output_dir: results/HQ

output:
  dir: runs/student/HQ
