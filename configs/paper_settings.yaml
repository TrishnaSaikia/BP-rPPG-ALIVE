# Consolidated settings used to reproduce the reported ALIVE experiments.
# The executable training scripts use configs/teacher.yaml and
# configs/student.yaml.

preprocessing:
  clip_seconds: 4
  non_overlapping_clips: true

  video_fps: 30
  video_trim_start_seconds: 10
  video_trim_end_seconds: 10
  clips_per_90_second_recording: 17

  bp_rppg_ppg_source_sampling_rate: 60
  bp_rppg_ppg_signal_column: Wave
  ppg_target_sampling_rate: 30
  ppg_teacher_start_offset_seconds: 0
  ppg_student_start_offset_seconds: 10
  samples_per_clip: 120

  signal_channel: green
  roi_block_size_pixels: [7, 7]
  k_signals: 15
  quality_frequency_band_hz: [0.7, 4.0]
  quality_window_bins: 3

architecture:
  convolution_filters: 5
  kernel_size: [1, 3]
  convolutions_per_dilation_block: 3
  dilation_schedule: "1, 2, 4, ..., 2^floor(log2(L))"
  feature_length: 120

student_training:
  optimizer: Adam
  epochs: 20
  batch_size: 4
  learning_rate: 0.0001
  feature_alignment_loss: negative_pearson
  data_fidelity_loss: squared_error_sbp_plus_dbp

evaluation:
  subject_split: [0.8, 0.1, 0.1]
  metrics: [MAE, ME, STD]
  fusion: quality_weighted_average
